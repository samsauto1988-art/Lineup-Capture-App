<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lineup – same angle, every car</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8EB; --surface:#F5F7F8; --ink:#12181C; --ink2:#48545D; --line:#BFC8CE;
  --paint:#FFC400; --paintInk:#12181C; --asphalt:#1A2126; --ok:#178A4C; --bad:#C0392B; --focus:#0B62D6;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101519; --surface:#192026; --ink:#EDF1F3; --ink2:#9AA8B1; --line:#2C373F;
    --paint:#FFCB1F; --asphalt:#0A0E11; --ok:#43D98A; --bad:#FF7263; --focus:#7DB8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#101519; --surface:#192026; --ink:#EDF1F3; --ink2:#9AA8B1; --line:#2C373F;
  --paint:#FFCB1F; --asphalt:#0A0E11; --ok:#43D98A; --bad:#FF7263; --focus:#7DB8FF;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html.camopen,html.camopen body{overflow:hidden}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}

#app{max-width:720px;margin:0 auto;padding:18px 16px 120px}

/* type */
.wordmark{font:700 60px/0.9 var(--display);letter-spacing:-.5px}
.wordmark::after{content:'';display:block;width:132px;height:5px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--paint) 0 26px,transparent 26px 42px)}
.sub{margin-top:12px;color:var(--ink2);font-size:18px}
h2{font:700 26px/1.05 var(--display);letter-spacing:.2px}
.note{color:var(--ink2);font-size:15px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.count{font:700 22px/1 var(--display);color:var(--ink2)}

/* buttons */
.btn{appearance:none;border:0;min-height:48px;padding:0 20px;border-radius:12px;font-weight:600;font-size:17px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.primary{background:var(--paint);color:var(--paintInk);box-shadow:none}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{min-height:40px;font-size:15px;padding:0 14px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45}
.iconbtn{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line);flex:none}

/* cards and lists */
.card{background:var(--surface);border-radius:10px;padding:16px;margin:18px 0;box-shadow:0 0 0 1.5px var(--line);display:grid;gap:12px}
.head{margin-top:26px}
.empty{margin:14px 0;color:var(--ink2)}
.vlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.vrow{appearance:none;width:100%;text-align:left;border:0;background:var(--surface);border-radius:10px;padding:14px 16px;display:grid;gap:9px;cursor:pointer;box-shadow:0 0 0 1.5px var(--line)}
.vrow .t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.vrow .stock{font:700 28px/1 var(--display);overflow-wrap:anywhere}
.vrow .meta{color:var(--ink2);font-size:15px;white-space:nowrap}
.banner{background:var(--paint);color:var(--paintInk);border-radius:10px;padding:12px 14px;font-weight:500;margin-top:16px}

/* the road: one dash per shot */
.road{display:flex;align-items:center;gap:5px;padding:9px 9px;background:var(--asphalt);border-radius:8px;min-height:26px}
.road i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.road i.on{background:var(--paint)}
.road i.cur{height:9px;box-shadow:0 0 0 1.5px #fff}

/* screens */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar .ttl{min-width:0}
.bar h1{font:700 40px/1 var(--display);overflow-wrap:anywhere}
.bar .note{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;aspect-ratio:var(--ar,4/3);padding:0;border:2px dashed var(--line);border-radius:6px;overflow:hidden;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.tile.has{border:0;background:var(--surface)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .n{position:absolute;left:9px;top:6px;font:700 24px/1 var(--display);color:var(--ink2)}
.tile.has .n{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:8px;font-weight:600;font-size:14px;line-height:1.15;color:var(--ink2)}
.tile.has .lbl{padding-top:26px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.tile:not(.has) .lbl{top:34px;bottom:auto;color:var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.dock .btn{flex:1}
.dock .btn.primary{flex:2}

/* settings */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:76px}
.seg .btn.sel{background:var(--ink);color:var(--bg);box-shadow:none}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch input{width:26px;height:26px;accent-color:var(--ink);flex:none}
.shots{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.shots li{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center}
.shots input[type=checkbox]{width:26px;height:26px;accent-color:var(--ink)}
.shots .num{font:700 20px/1 var(--display);color:var(--ink2);width:24px;text-align:right}
.field{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:17px}
.shots .field{min-height:44px}
.shots .iconbtn{width:40px;height:40px}
.shots li.off .field{opacity:.5}
.addrow{display:grid;gap:8px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h3{font:700 28px/1 var(--display)}
.sheet .prev{width:100%;border-radius:8px;display:block}
.sheet .acts{display:grid;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:500;max-width:calc(100% - 32px);text-align:center;pointer-events:none}

/* camera */
#cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:grid;
  grid-template-columns:calc(76px + env(safe-area-inset-left,0px)) minmax(0,1fr) calc(124px + env(safe-area-inset-right,0px));
  --paint:#FFCB1F;--okc:#46E08A}
.rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 8px calc(10px + env(safe-area-inset-bottom,0px))}
.rail.left{justify-content:space-between;padding-left:calc(8px + env(safe-area-inset-left,0px))}
.rail.left .mid{display:flex;flex-direction:column;gap:14px}
.rail.right{justify-content:center;padding-right:calc(8px + env(safe-area-inset-right,0px))}
.cbtn{appearance:none;border:0;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.cbtn[disabled]{opacity:.3}
.tbtn{appearance:none;border:0;min-width:84px;min-height:46px;border-radius:23px;background:rgba(255,255,255,.16);color:#fff;font-weight:600;font-size:14px;line-height:1.1;padding:6px 10px;cursor:pointer;text-align:center}
.tbtn.on{background:var(--paint);color:#111}
.tbtn[disabled]{opacity:.35}
#shutter{appearance:none;position:relative;width:82px;height:82px;border-radius:50%;border:4px solid #fff;background:transparent;cursor:pointer;flex:none;margin-top:6px}
#shutter::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
#shutter:active::after{inset:9px}
#shutter.ready{border-color:var(--okc)}
#shutter.ready::after{background:var(--okc)}
#shutter.tilt{border-color:var(--paint)}
#shutter[disabled]{opacity:.35}
.wrap{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}
.stage{position:relative;overflow:hidden;background:#111;width:100%;aspect-ratio:4/3}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#ghost.outline{filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
#ghost.photo{opacity:.42}
#guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#guides .sh *{fill:none;stroke:rgba(0,0,0,.55);stroke-width:4.5;vector-effect:non-scaling-stroke}
#guides .hl *{fill:none;stroke:var(--paint);stroke-width:2;vector-effect:non-scaling-stroke}
#lvl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#lvlLine{grid-area:1/1;width:30%;height:3px;border-radius:2px;background:var(--paint);box-shadow:0 0 0 1.5px rgba(0,0,0,.55);transform:translateY(var(--ty,0px)) rotate(var(--rot,0deg))}
#lvlDot{grid-area:1/1;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
#lvl.ok #lvlLine{background:var(--okc)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.fire{animation:fl .2s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.hud{position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--sw,100%) - 20px);z-index:3;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:10px;padding:8px 10px}
.hud.top{top:calc(8px + env(safe-area-inset-top,0px));display:grid;gap:7px}
.hud.bottom{bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.3;text-align:center}
.hud .line{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#camTitle{font:700 24px/1 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#camTitle span{color:var(--paint);margin-right:8px}
#lvlText{font-weight:600;font-size:14px;white-space:nowrap;color:var(--paint)}
#lvlText.ok{color:var(--okc)}
#camMsg{position:absolute;inset:0;z-index:5;display:grid;place-content:center;gap:14px;padding:24px;text-align:center;background:rgba(0,0,0,.82)}
#camMsg p{max-width:420px;margin:0 auto}
#camMsg .btn{background:#fff;color:#111}
#camMsg .btn.primary{background:var(--paint)}
#rotate{position:absolute;inset:0;z-index:4;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.72);font:700 30px/1.1 var(--display);padding:24px}
@media (orientation:portrait){
  #cam{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .rail{flex-direction:row;justify-content:space-between!important;padding:8px 12px}
  .rail.left{padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .rail.left .mid{flex-direction:row}
  .rail.right{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .hud.top{top:8px}
}
@media (orientation:landscape) and (max-height:520px){#camDashes{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<section id="cam" hidden aria-label="Camera">
  <div class="rail left">
    <button class="cbtn" data-act="cam-close" aria-label="Close camera"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="mid">
      <button class="cbtn" data-act="cam-prev" aria-label="Previous shot"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="cbtn" data-act="cam-next" aria-label="Next shot"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <span style="width:52px;height:1px" aria-hidden="true"></span>
  </div>
  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <video id="vid" playsinline muted autoplay></video>
      <img id="ghost" alt="" hidden>
      <svg id="guides" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="lvl" hidden><i id="lvlLine"></i><b id="lvlDot"></b></div>
      <div id="flash"></div>
    </div>
    <div class="hud top">
      <div class="line"><div id="camTitle"></div><div id="lvlText"></div></div>
      <div id="camDashes"></div>
    </div>
    <div class="hud bottom" id="camTip"></div>
    <div id="rotate" hidden>Turn your phone sideways</div>
    <div id="camMsg" hidden></div>
  </div>
  <div class="rail right">
    <button class="tbtn" id="btnRef" data-act="cam-ref"></button>
    <button class="tbtn" id="btnGuides" data-act="cam-guides"></button>
    <button id="shutter" data-act="cam-shoot" aria-label="Take photo"></button>
  </div>
</section>

<div id="overlay"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="filePick" accept="image/*" hidden>
<script>
'use strict';
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const slug = s => (String(s).trim().replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40)) || 'vehicle';
const pad = n => String(n).padStart(2, '0');
const ASPECTS = { '4:3': 4 / 3, '3:2': 3 / 2, '16:9': 16 / 9 };
const REF = '__reference__';
const ico = {
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  up: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};

/* ============ default shot list ============ */
/* guide: c34a = near wheel on the left (front-left / rear-right corners)
          c34b = near wheel on the right (front-right / rear-left corners) */
const DEFAULT_SHOTS = [
  { id: 'ext-fl', name: 'Front left corner',  guide: 'c34a', tip: 'Stand off the front-left corner at 45°. Tires on the line, wheels in the rings.' },
  { id: 'ext-l',  name: 'Driver side',        guide: 'side', tip: 'Square to the driver door, centered on the car. Tires on the line.' },
  { id: 'ext-rl', name: 'Rear left corner',   guide: 'c34b', tip: 'Stand off the rear-left corner at 45°. Tires on the line, wheels in the rings.' },
  { id: 'ext-b',  name: 'Rear',               guide: 'head', tip: 'Centered behind the car, square to the bumper. Tires on the line.' },
  { id: 'ext-rr', name: 'Rear right corner',  guide: 'c34a', tip: 'Stand off the rear-right corner at 45°. Tires on the line, wheels in the rings.' },
  { id: 'ext-r',  name: 'Passenger side',     guide: 'side', tip: 'Square to the passenger door, centered on the car. Tires on the line.' },
  { id: 'ext-fr', name: 'Front right corner', guide: 'c34b', tip: 'Stand off the front-right corner at 45°. Tires on the line, wheels in the rings.' },
  { id: 'ext-f',  name: 'Front',              guide: 'head', tip: 'Centered in front of the car, square to the grille. Tires on the line.' },
  { id: 'int-dash',    name: 'Dashboard',                   guide: 'int',    tip: 'Driver door open, dash centered. Keep the phone level.' },
  { id: 'int-cluster', name: 'Gauge cluster and odometer',  guide: 'detail', tip: 'Ignition on. Odometer readable and centered.' },
  { id: 'int-screen',  name: 'Center screen and controls',  guide: 'detail', tip: 'Screen on the home view. Avoid glare.' },
  { id: 'int-front',   name: 'Front seats',                 guide: 'int',    tip: 'From the rear door, both front seats in frame.' },
  { id: 'int-rear',    name: 'Rear seats',                  guide: 'int',    tip: 'From the opposite rear door, seat fully in frame.' },
  { id: 'int-cargo',   name: 'Cargo area',                  guide: 'int',    tip: 'Hatch or trunk open, floor visible.' },
  { id: 'whl',         name: 'Front wheel',                 guide: 'detail', tip: 'Wheel centered, straight-on to the tire face.' },
  { id: 'eng',         name: 'Engine bay',                  guide: 'int',    tip: 'Hood open, engine centered.' }
];
const GUIDE_LABELS = {
  side: 'Side view', head: 'Front or rear view', c34a: 'Corner: car faces left', c34b: 'Corner: car faces right',
  int: 'Interior', detail: 'Close-up'
};
const EXTERIOR = new Set(['side', 'head', 'c34a', 'c34b']);

/* ============ storage (IndexedDB with in-memory fallback) ============ */
const Store = (() => {
  let db = null, memOnly = false;
  const mem = { kv: new Map(), vehicles: new Map(), photos: new Map() };
  const open = () => new Promise(resolve => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    try {
      const r = indexedDB.open('lineup-v1', 1);
      r.onupgradeneeded = () => {
        for (const n of ['kv', 'vehicles', 'photos'])
          if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n);
      };
      r.onsuccess = () => { db = r.result; fin(); };
      r.onerror = r.onblocked = () => { memOnly = true; fin(); };
    } catch (e) { memOnly = true; fin(); }
    setTimeout(() => { if (!db) memOnly = true; fin(); }, 3000);
  });
  const tx = (store, mode, fn) => new Promise((resolve, reject) => {
    let req;
    try {
      const t = db.transaction(store, mode);
      req = fn(t.objectStore(store));
      t.oncomplete = () => resolve(req ? req.result : undefined);
      t.onerror = t.onabort = () => reject(t.error || new Error('storage'));
    } catch (e) { reject(e); }
  });
  return {
    open,
    isMem: () => memOnly,
    get: (s, k) => memOnly ? Promise.resolve(mem[s].get(k)) : tx(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => memOnly ? (mem[s].set(k, v), Promise.resolve()) : tx(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => memOnly ? (mem[s].delete(k), Promise.resolve()) : tx(s, 'readwrite', o => o.delete(k)),
    all: (s, prefix = '') => memOnly
      ? Promise.resolve([...mem[s]].filter(([k]) => k.startsWith(prefix)).map(([key, value]) => ({ key, value })))
      : new Promise((resolve, reject) => {
          const out = [];
          try {
            const t = db.transaction(s, 'readonly');
            const rng = prefix ? IDBKeyRange.bound(prefix, prefix + '\uffff') : null;
            const req = t.objectStore(s).openCursor(rng);
            req.onsuccess = () => { const c = req.result; if (c) { out.push({ key: c.key, value: c.value }); c.continue(); } };
            t.oncomplete = () => resolve(out);
            t.onerror = t.onabort = () => reject(t.error || new Error('storage'));
          } catch (e) { reject(e); }
        })
  };
})();

/* ============ state ============ */
const S = {
  settings: null,
  vehicles: [],
  cur: null,          // vehicle record being viewed

/* ============ images ============ */
const toBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), type, q));
function coverRect(w, h, ar) {
  if (w / h > ar) { const sw = h * ar; return { sx: (w - sw) / 2, sy: 0, sw, sh: h }; }
  const sh = w / ar; return { sx: 0, sy: (h - sh) / 2, sw: w, sh };
}
/* Crop a video frame or bitmap to the chosen shape, so every photo has identical framing and size. */
async function processSource(src, sw, sh) {
  const ar = aspect(), r = coverRect(sw, sh, ar);
  const ow = Math.min(2048, Math.round(r.sw)), oh = Math.round(ow / ar);
  const c = document.createElement('canvas'); c.width = ow; c.height = oh;
  c.getContext('2d').drawImage(src, r.sx, r.sy, r.sw, r.sh, 0, 0, ow, oh);
  const blob = await toBlob(c, 'image/jpeg', 0.9);
  const tw = 360, th = Math.round(tw / ar);
  const t = document.createElement('canvas'); t.width = tw; t.height = th;
  t.getContext('2d').drawImage(c, 0, 0, tw, th);
  const thumb = await toBlob(t, 'image/jpeg', 0.7);
  return { blob, thumb, w: ow, h: oh, takenAt: Date.now() };
}
/* Turn a reference photo into a yellow edge outline you can see the live car through. */
async function makeOutline(blob, ar) {
  const bmp = await createImageBitmap(blob);
  const W = 960, H = Math.round(W / ar);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  const r = coverRect(bmp.width, bmp.height, ar);
  x.drawImage(bmp, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H);
  if (bmp.close) bmp.close();
  const d = x.getImageData(0, 0, W, H).data, n = W * H;
  let g = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
  const b = new Float32Array(n);                      // light blur to calm texture noise
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const i = y * W + xx;
    b[i] = (g[i - W - 1] + g[i - W] + g[i - W + 1] + g[i - 1] + g[i] * 2 + g[i + 1] + g[i + W - 1] + g[i + W] + g[i + W + 1]) / 10;
  }
  const mag = new Float32Array(n); let max = 0;
  for (let y = 1; y < H - 1; y++) for (let xx = 1; xx < W - 1; xx++) {
    const i = y * W + xx;
    const gx = -b[i - W - 1] - 2 * b[i - 1] - b[i + W - 1] + b[i - W + 1] + 2 * b[i + 1] + b[i + W + 1];
    const gy = -b[i - W - 1] - 2 * b[i - W] - b[i - W + 1] + b[i + W - 1] + 2 * b[i + W] + b[i + W + 1];
    const m = Math.hypot(gx, gy); mag[i] = m; if (m > max) max = m;
  }
  const hist = new Uint32Array(256), sc = 255 / (max || 1);
  for (let i = 0; i < n; i++) hist[Math.min(255, (mag[i] * sc) | 0)]++;
  let acc = 0, cut = 0; const want = n * 0.93;          // keep the strongest ~7% of pixels
  for (; cut < 256; cut++) { acc += hist[cut]; if (acc >= want) break; }
  const t = Math.max(cut / sc, 24);
  const out = x.createImageData(W, H), o = out.data;
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    if (mag[i] > t) { o[j] = 255; o[j + 1] = 203; o[j + 2] = 31; o[j + 3] = Math.min(255, 130 + (mag[i] - t) * 3); }
  }
  x.clearRect(0, 0, W, H); x.putImageData(out, 0, 0);
  return URL.createObjectURL(await toBlob(c, 'image/png'));
}
async function ensureGhost(shotId, rec) {
  const key = rec.takenAt + ':' + S.settings.aspect;
  const g = S.ghost.get(shotId);
  if (g && g.key === key) return g;
  dropGhost(shotId);
  const ng = { key, photo: URL.createObjectURL(rec.blob), outline: await makeOutline(rec.blob, aspect()) };
  S.ghost.set(shotId, ng); return ng;
}

/* ============ starter guides (used until a reference exists) ============ */
function guideSVG(type, ar) {
  const W = 1000, H = Math.round(1000 / ar), m = 38, L = 46;
  let s = `<path d="M${m} ${m + L}V${m}H${m + L}M${W - m - L} ${m}H${W - m}V${m + L}M${W - m} ${H - m - L}V${H - m}H${W - m - L}M${m + L} ${H - m}H${m}V${H - m - L}"/>`;
  s += `<path d="M500 ${m + 14}V${H - m - 14}" stroke-dasharray="3 12"/>`;
  if (EXTERIOR.has(type)) {
    const gy = Math.round(H * 0.72);
    s += `<path d="M${m} ${gy}H${W - m}" stroke-dasharray="16 9"/>`;
    if (type === 'side') {
      for (const cx of [262, 738]) s += `<circle cx="${cx}" cy="${gy - 58}" r="58"/>`;
    } else if (type === 'head') {
      for (const cx of [245, 755]) s += `<rect x="${cx - 37}" y="${gy - 190}" width="74" height="190" rx="14"/>`;
    } else {
      const f = type === 'c34a' ? 1 : -1, X = v => f === 1 ? v : W - v;
      s += `<ellipse cx="${X(292)}" cy="${gy + 20 - 76}" rx="52" ry="76"/>`;
      s += `<ellipse cx="${X(724)}" cy="${gy - 12 - 52}" rx="36" ry="52"/>`;
    }
  } else {
    s += `<path d="M${W / 3} 0V${H}M${2 * W / 3} 0V${H}M0 ${H / 3}H${W}M0 ${2 * H / 3}H${W}" stroke-dasharray="2 10"/>`;
  }
  return { vb: `0 0 ${W} ${H}`, html: `<g class="sh">${s}</g><g class="hl">${s}</g>` };
}

/* ============ zip (store-only, no library needed) ============ */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function buildZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true);
    lh.setUint32(22, size, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + size;
  }
  let csize = 0; for (const c of central) csize += c.byteLength;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

/* ============ saving files out of the page ============ */
let dl = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(x => { dl = x; }).catch(() => {}); } catch (e) {}
async function saveFile(blob, filename) {
  if (dl) {
    try { await dl.save({ filename, data: blob }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; }
  }
  try {
    const f = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); return true;
  } catch (e) { toast('Saving files is not available in this view.'); return false; }
}

/* ============ small UI helpers ============ */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}
function sheet({ title, html = '', actions = [] }) {
  return new Promise(resolve => {
    const root = document.createElement('div'); root.className = 'scrim';
    root.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}<div class="acts">${
      actions.map(a => `<button class="btn ${a.kind || ''}" data-r="${a.id}">${esc(a.label)}</button>`).join('')}</div></div>`;
    const close = id => { const inp = root.querySelector('input'); const val = inp ? inp.value : ''; root.remove(); resolve({ id, val }); };
    root.addEventListener('click', e => {
      if (e.target === root) return close(null);
      const b = e.target.closest('[data-r]'); if (b) close(b.dataset.r);
    });
    root.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { const p = actions.find(a => a.kind === 'primary'); if (p) close(p.id); }
    });
    $('#overlay').appendChild(root);
    const first = root.querySelector('input') || root.querySelector('button'); if (first) first.focus();
  });
}

async function tileAction(i) {

  const acts = [{ id: 'retake', label: 'Retake', kind: 'primary' }];
  if (!isRef) acts.push({ id: 'ref', label: 'Use as the reference for this angle' });
  acts.push({ id: 'save', label: 'Save photo' }, { id: 'del', label: 'Delete photo', kind: 'danger' }, { id: 'close', label: 'Close', kind: 'ghost' });
  const r = await sheet({ title: `${i + 1}. ${s.name}`, html: `<img class="prev" src="${objURL(p.blob)}" alt="${esc(s.name)}">`, actions: acts });
  if (r.id === 'retake') return openCamera(i);
  if (r.id === 'save') return void saveFile(p.blob, `${slug(S.cur.stock)}_${pad(i + 1)}_${slug(s.name)}.jpg`);

      title: `${list.length - have.length} shots still missing`,
      html: '<p class="note">Export anyway? Each file keeps its shot number, so the order stays the same.</p>',
      actions: [{ id: 'go', label: 'Export what I have', kind: 'primary' }, { id: 'no', label: 'Keep shooting', kind: 'ghost' }]
    });
    if (r.id !== 'go') return;
  }
  toast('Preparing zip…');
  const stock = slug(S.cur.stock), files = [];
  for (let i = 0; i < list.length; i++) {
    const p = S.photos.get(list[i].id); if (!p) continue;
    files.push({ name: `${stock}_${pad(i + 1)}_${slug(list[i].name)}.jpg`, data: new Uint8Array(await p.blob.arrayBuffer()) });
  }
  const ok = await saveFile(buildZip(files), `${stock}.zip`);
  if (ok) toast(`Exported ${files.length} photos.`);
}

/* ============ camera ============ */
let C = null, wakeLock = null, sensorOn = false, sm = null;
const camEl = $('#cam'), vid = $('#vid'), stage = $('#stage'), wrap = $('#wrap');
const isPortrait = () => matchMedia('(orientation: portrait)').matches;

function fitStage() {
  if (!S.settings) return;
  const ar = aspect(), w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  let sw = w, sh = w / ar; if (sh > h) { sh = h; sw = h * ar; }
  stage.style.aspectRatio = 'auto'; stage.style.width = sw + 'px'; stage.style.height = sh + 'px'; wrap.style.setProperty('--sw', sw + 'px');
}
new ResizeObserver(fitStage).observe(wrap);
addEventListener('orientationchange', () => setTimeout(() => { fitStage(); updateGate(); }, 250));
addEventListener('resize', () => { updateGate(); });

async function openCamera(idx) {
  const list = enabledShots();
  if (!list.length) return toast('Turn on at least one shot in Settings.');
  C = { idx: Math.max(0, Math.min(idx, list.length - 1)), list, ref: 'outline', starter: null, stream: null, roll: 0, pitch: 0, sensor: false, level: false, busy: false };
  document.documentElement.classList.add('camopen');
  app.hidden = true; camEl.hidden = false;
  requestSensors();
  wake();
  fitStage();
  const streamP = startStream(); streamP.catch(() => {});
  await updateCam();
  try { await streamP; $('#camMsg').hidden = true; } catch (e) { camError(e); }
  updateGate();
}
async function wake() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && C) wake(); });

async function startStream() {
  stopStream();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { const e = new Error('nomedia'); e.name = 'NoMedia'; throw e; }
  const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } } });
  if (!C) { s.getTracks().forEach(t => t.stop()); return; }
  C.stream = s; vid.srcObject = s;
  await vid.play().catch(() => {});
  try {   // lock the lens at 1x where the browser allows it, so framing never drifts between shots
    const t = s.getVideoTracks()[0], caps = t.getCapabilities && t.getCapabilities();
    if (caps && caps.zoom) await t.applyConstraints({ advanced: [{ zoom: Math.min(Math.max(1, caps.zoom.min), caps.zoom.max) }] });
  } catch (e) {}
}
function stopStream() {
  if (C && C.stream) { C.stream.getTracks().forEach(t => t.stop()); C.stream = null; }
  vid.srcObject = null;
}
function camError(e) {
  const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
  const m = $('#camMsg'); m.hidden = false;
  m.innerHTML = `<p><strong>${denied ? 'Camera access is blocked.' : 'The live camera is not available here.'}</strong></p>
    <p>${denied ? 'Allow camera access in your browser settings, then try again. ' : ''}You can still shoot with your phone's camera app. Lineup crops it to the same shape, but the live guides need the live camera.</p>
    <div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn primary" data-act="cam-file">Use phone camera</button><button class="btn" data-act="cam-pick">Choose a photo</button><button class="btn" data-act="cam-retry">Try again</button></div>`;
}

/* level: works out roll and pitch from the phone's motion sensors */
async function requestSensors() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') return;
    }
    if (!sensorOn) { addEventListener('deviceorientation', onOri, true); sensorOn = true; }
  } catch (e) {}
}
function onOri(e) {
  if (!C || e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const ux = -Math.sin(g) * Math.cos(b), uy = Math.sin(b), uz = Math.cos(g) * Math.cos(b);   // "up" in device axes
  const ang = ((screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0)) * Math.PI / 180;
  const v = [ux * Math.cos(ang) - uy * Math.sin(ang), ux * Math.sin(ang) + uy * Math.cos(ang), uz];  // in screen axes
  sm = sm ? sm.map((x, i) => x * 0.75 + v[i] * 0.25) : v;
  C.roll = Math.atan2(sm[0], sm[1]) * 180 / Math.PI;
  C.pitch = Math.asin(Math.max(-1, Math.min(1, sm[2]))) * 180 / Math.PI;
  C.sensor = true;
  const tol = S.settings.tol;
  C.level = Math.abs(C.roll) <= tol && Math.abs(C.pitch) <= tol;
  paintLevel();
}
function paintLevel() {
  const l = $('#lvl'), t = $('#lvlText');
  if (!C || !C.sensor) { l.hidden = true; t.textContent = ''; return; }
  l.hidden = false; l.classList.toggle('ok', C.level);
  const H = stage.clientHeight || 300, ty = Math.max(-H * 0.4, Math.min(H * 0.4, -C.pitch * (H / 50)));
  l.style.setProperty('--rot', Math.max(-45, Math.min(45, C.roll)).toFixed(1) + 'deg');
  l.style.setProperty('--ty', ty.toFixed(1) + 'px');
  t.classList.toggle('ok', C.level);
  t.textContent = C.level ? 'Level' : (Math.abs(C.roll) >= Math.abs(C.pitch)
    ? `Tilted ${Math.min(99, Math.abs(C.roll)).toFixed(0)}°`
    : `Aimed ${C.pitch > 0 ? 'down' : 'up'} ${Math.min(99, Math.abs(C.pitch)).toFixed(0)}°`);
  updateGate();
}
function updateGate() {
  if (!C || camEl.hidden) return;
  const portrait = isPortrait(), sh = $('#shutter');
  $('#rotate').hidden = !portrait;
  sh.disabled = !C.stream || portrait;
  sh.classList.toggle('ready', C.sensor && C.level);
  sh.classList.toggle('tilt', C.sensor && !C.level);
}

async function updateCam() {
  const s = C.list[C.idx], ar = aspect(), isRef = S.cur.id === REF;
  $('#camTitle').innerHTML = `<span>${C.idx + 1}/${C.list.length}</span>${esc(s.name)}${S.photos.has(s.id) ? ' ✓' : ''}`;
  $('#camTip').textContent = s.tip || 'Same spot and framing on every car.';
  $('#camDashes').innerHTML = road(C.list, id => S.photos.has(id), s.id);
  const refRec = isRef ? null : S.refs.get(s.id);
  const starter = C.starter === null ? !refRec : C.starter;
  const g = guideSVG(s.guide, ar), svg = $('#guides');
  svg.setAttribute('viewBox', g.vb); svg.innerHTML = starter ? g.html : '';
  const bg = $('#btnGuides'); bg.textContent = starter ? 'Guides on' : 'Guides off'; bg.classList.toggle('on', starter);
  const gh = $('#ghost'), br = $('#btnRef');
  if (refRec && C.ref !== 'off') {
    br.disabled = false; br.classList.add('on'); br.textContent = C.ref === 'outline' ? 'Outline' : 'Photo';
    try {
      const gg = await ensureGhost(s.id, refRec);
      if (C && C.list[C.idx].id === s.id) { gh.src = C.ref === 'outline' ? gg.outline : gg.photo; gh.className = C.ref; gh.hidden = false; }
    } catch (e) { gh.hidden = true; }
  } else {
    gh.hidden = true; gh.removeAttribute('src');
    br.disabled = !refRec; br.classList.remove('on');
    br.textContent = refRec ? 'Reference off' : (isRef ? 'Overlay n/a' : 'No reference');
  }
  fitStage(); paintLevel();
}

function flash() { const f = $('#flash'); f.classList.remove('fire'); void f.offsetWidth; f.classList.add('fire'); }
async function shoot() {
  if (!C || C.busy) return;
  if (isPortrait()) return toast('Turn your phone sideways to shoot.');
  if (!C.stream || !vid.videoWidth) return toast('The camera is not ready yet.');
  if (S.settings.blockTilt && C.sensor && !C.level) { if (navigator.vibrate) navigator.vibrate(60); return toast('Hold the phone level to shoot.'); }
  C.busy = true; flash(); if (navigator.vibrate) navigator.vibrate(20);
  try { await afterCapture(await processSource(vid, vid.videoWidth, vid.videoHeight)); }
  catch (e) { toast('Could not save that photo. Storage may be full.'); }
  finally { if (C) C.busy = false; }
}
async function afterCapture(rec) {
  const s = C.list[C.idx], had = S.photos.has(s.id);
  await savePhoto(s.id, rec);
  if (had || C.idx >= C.list.length - 1) closeCamera(had ? 'Photo replaced.' : 'That was the last shot.');
  else { C.idx++; await updateCam(); }
}
function closeCamera(msg) {
  stopStream();
  if (sensorOn) { removeEventListener('deviceorientation', onOri, true); sensorOn = false; }
  sm = null;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  C = null; camEl.hidden = true; document.documentElement.classList.remove('camopen');
  $('#ghost').hidden = true; $('#lvl').hidden = true; $('#camMsg').hidden = true; $('#rotate').hidden = true;
  app.hidden = false;
  drawVehicle(); if (msg) toast(msg);
}
async function handleFile(file) {
  if (!file || !C) return;
  try {
    let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(file); }
    if (bmp.height > bmp.width) toast('That photo was upright, so it was cropped. Hold the phone sideways for best results.');
    const rec = await processSource(bmp, bmp.width, bmp.height); if (bmp.close) bmp.close();
    await afterCapture(rec);
  } catch (e) { toast('Could not read that photo.'); }
}
for (const id of ['fileCam', 'filePick']) $('#' + id).addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; handleFile(f); });

/* ============ events ============ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, i = +el.dataset.i, v = el.dataset.v;
  try {
    switch (a) {
      case 'home': return showHome();
      case 'settings': return showSettings();
      case 'open-vehicle': return showVehicle(id);
      case 'open-ref': return showVehicle(REF);
      case 'new-vehicle': {
        const r = await sheet({
          title: 'New vehicle',
          html: '<div><label class="note" for="stockIn">Stock number or VIN</label><input id="stockIn" class="field" autocomplete="off" autocapitalize="characters" placeholder="e.g. A1042"></div>',
          actions: [{ id: 'ok', label: 'Create and continue', kind: 'primary' }, { id: 'no', label: 'Cancel', kind: 'ghost' }]
        });
        if (r.id !== 'ok') return;
        if (!r.val.trim()) return toast('Enter a stock number or VIN.');
        const nv = { id: uid(), stock: r.val.trim().toUpperCase(), created: Date.now(), updated: Date.now(), done: {} };
        await Store.put('vehicles', nv.id, nv); S.vehicles.unshift(nv);
        return showVehicle(nv.id);
      }
      case 'shoot': return openCamera(i);
      case 'tile': return tileAction(i);
      case 'export': return exportVehicle();
      case 'delete-vehicle': {
        const r = await sheet({ title: 'Delete this vehicle?', html: `<p class="note">${esc(S.cur.stock)} and all its photos will be removed from this device. Export first if you still need them.</p>`, actions: [{ id: 'del', label: 'Delete', kind: 'danger' }, { id: 'no', label: 'Keep it', kind: 'ghost' }] });
        if (r.id !== 'del') return;
        await deleteVehicle(S.cur); return showHome();
      }
      case 'clear-ref': {
        const r = await sheet({ title: 'Clear reference angles?', html: '<p class="note">New cars will go back to starter guides until you shoot the reference angles again.</p>', actions: [{ id: 'del', label: 'Clear them', kind: 'danger' }, { id: 'no', label: 'Keep them', kind: 'ghost' }] });
        if (r.id !== 'del') return;
        await deleteVehicle(S.cur); for (const k of [...S.ghost.keys()]) dropGhost(k);
        S.refs = new Map(); return showHome();
      }
      /* settings */
      case 'set-aspect': S.settings.aspect = v; await saveSettings(); for (const k of [...S.ghost.keys()]) dropGhost(k); return showSettings();
      case 'set-tol': S.settings.tol = +v; await saveSettings(); return showSettings();
      case 'shot-up': case 'shot-down': {
        const arr = S.settings.shots, k = arr.findIndex(s => s.id === id), j = a === 'shot-up' ? k - 1 : k + 1;
        if (k < 0 || j < 0 || j >= arr.length) return;
        [arr[k], arr[j]] = [arr[j], arr[k]]; await saveSettings(); return showSettings();
      }
      case 'shot-del': S.settings.shots = S.settings.shots.filter(s => s.id !== id); await saveSettings(); return showSettings();
      case 'add-shot': {
        const name = $('#newShotName').value.trim(); if (!name) return toast('Give the new shot a name.');
        S.settings.shots.push({ id: 'c-' + uid(), name, guide: $('#newShotGuide').value, on: true, custom: true, tip: '' });
        await saveSettings(); return showSettings();
      }
      case 'reset-shots': {
        const r = await sheet({ title: 'Reset the shot list?', html: '<p class="note">This restores the 16 default shots and removes any you added. Existing photos are not deleted.</p>', actions: [{ id: 'go', label: 'Reset', kind: 'danger' }, { id: 'no', label: 'Cancel', kind: 'ghost' }] });
        if (r.id !== 'go') return;
        S.settings.shots = DEFAULT_SHOTS.map(s => ({ ...s, on: true })); await saveSettings(); return showSettings();
      }
      /* camera */
      case 'cam-close': return closeCamera();
      case 'cam-prev': if (C && C.idx > 0) { C.idx--; return updateCam(); } return;
      case 'cam-next': if (C && C.idx < C.list.length - 1) { C.idx++; return updateCam(); } return;
      case 'cam-ref': if (C) { C.ref = C.ref === 'outline' ? 'photo' : C.ref === 'photo' ? 'off' : 'outline'; return updateCam(); } return;
      case 'cam-guides': if (C) {
        const cur = C.starter === null ? !(S.cur.id !== REF && S.refs.get(C.list[C.idx].id)) : C.starter;
        C.starter = !cur; return updateCam();
      } return;
      case 'cam-shoot': return shoot();
      case 'cam-file': return $('#fileCam').click();
      case 'cam-pick': return $('#filePick').click();
      case 'cam-retry': { $('#camMsg').hidden = true; try { await startStream(); } catch (err) { camError(err); } return updateGate(); }
    }
  } catch (err) { console.error(err); toast('Something went wrong. Try again.'); }
});

document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.dataset.shotOn) {
      const s = S.settings.shots.find(x => x.id === el.dataset.shotOn); if (s) { s.on = el.checked; await saveSettings(); el.closest('li').classList.toggle('off', !s.on); }
    } else if (el.dataset.shotName) {
      const s = S.settings.shots.find(x => x.id === el.dataset.shotName); if (s) { s.name = el.value.trim() || s.name; el.value = s.name; await saveSettings(); }
    } else if (el.id === 'blockTilt') { S.settings.blockTilt = el.checked; await saveSettings(); }
  } catch (err) { toast('Could not save that change.'); }
});

/* ============ boot ============ */
(async function init() {
  try {
    await Store.open();
    await loadSettings();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    await showHome();
  } catch (err) {
    console.error(err);
    app.innerHTML = '<h1 class="wordmark">Lineup</h1><p class="banner">Something went wrong while starting. Reload the page to try again.</p>';
  }
})();
</script>
</body>
</html>
